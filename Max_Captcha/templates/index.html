<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Assembly Puzzle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Assemble the Box</h1>
            <p>Drag the pieces to form a box on the right side. Click to rotate, hold to drag.</p>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="puzzle-canvas"></canvas>
            
            <!-- Ghost template showing target box shape -->
            <div class="ghost-template">
                <svg width="120" height="120" viewBox="0 0 120 120">
                    <!-- Top bar -->
                    <rect x="10" y="5" width="100" height="10" fill="#999" opacity="0.3"/>
                    <!-- Bottom bar -->
                    <rect x="10" y="105" width="100" height="10" fill="#999" opacity="0.3"/>
                    <!-- Left bar -->
                    <rect x="5" y="10" width="10" height="100" fill="#999" opacity="0.3"/>
                    <!-- Right bar -->
                    <rect x="105" y="10" width="10" height="100" fill="#999" opacity="0.3"/>
                </svg>
            </div>
        </div>

        <button id="submit-btn" disabled>Complete Assembly First</button>
        <p id="status-message"></p>
    </div>

    <!-- Load Matter.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Load our puzzle logic -->
    <script src="{{ url_for('static', filename='js/puzzle.js') }}"></script>
</body>
</html>
